[package]
name = "prowriter-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# server
warp = { version = "0.3" }
tokio = { version = "1", features = ["full"] }
bytes = "1.4.0"

# logging
env_logger = "0.10.0"
log = "0.4"

#common
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
rand = "0.8.5"

# to load env file in development
dotenv = "0.15"

# noctowl
yrs = "0.16.7"
sqlx = { version = "0.6", features = [ "runtime-tokio-rustls", "sqlite" ] }

# accounts
reqwest = { version = "0.11", features = ["json"] }
jsonwebtoken = "8.3.0"
serde_urlencoded = "0.7.0"
validator = "0.16.0"
bcrypt = "0.14.0"
# chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4.0"
