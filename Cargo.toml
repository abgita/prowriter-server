[package]
name = "prowriter-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# server
warp = { version = "0.3" }
tokio = { version = "1.0", features = ["full"] }
bytes = "1.4.0"

# logging
env_logger = "0.10.0"
log = "0.4"

#common
chrono = "0.4"
uuid = { version = "1.3.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.68"

# to load env file in development
dotenv = "0.15"

# noctowl
yrs = "0.16.5"
